# Every news item is a launcher release (owner, 2026-11-16). Hourly (and on demand) rebuilds
# news.json and news/<tag>/ from anarqz/InfinityHorizon's published releases, commits when
# something changed, and asks the site to rebuild (event release-published).
name: sync-releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/from_releases.py && python3 -I scripts/validate.py
      - name: Commit
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "infinity-news-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news news.json
          git commit -m "news: sync from launcher releases"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ask the site to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then echo "SITE_DISPATCH_TOKEN is not set; the site was not asked to rebuild" >&2; exit 1; fi
          gh api --silent repos/anarqz/ForzaInfinity/dispatches -f event_type=release-published
